<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>ZADATAK 2 - nove boje</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #111; /* tamna pozadina */
        }
        svg { 
            background-color: #1e1e2f; 
            border-radius: 10px;
        }
    </style>
</head>
<body>

<script>
const widthSVG = 800;
const heightSVG = 600;

const svg = d3.select("body")
  .append("svg")
  .attr("width", widthSVG)
  .attr("height", heightSVG);

// 🎨 definiramo paletu boja
const boje = [
    "#ff6b6b", // crveno
    "#feca57", // žuto
    "#48dbfb", // svijetlo plavo
    "#1dd1a1", // mint
    "#5f27cd", // ljubičasto
    "#ff9ff3", // pink
    "#54a0ff", // plavo
    "#00d2d3"  // tirkizno
];

// funkcija za slučajnu boju
function randomBoja() {
    return boje[Math.floor(Math.random() * boje.length)];
}

// animacija kvadrata
function animirajKvadrat(kvadrat) {

    const startX = Math.random() * (widthSVG - 100);
    const startY = Math.random() * (heightSVG - 100);
    const startSize = 40 + Math.random() * 60;

    const trajanjePunjenja = 2000 + Math.random() * 4000;
    const trajanjeNestajanja = 2000 + Math.random() * 4000;

    const boja = randomBoja();

    // reset
    kvadrat
        .attr("x", startX)
        .attr("y", startY)
        .attr("width", startSize)
        .attr("height", startSize)
        .attr("fill", "rgba(255,255,255,0.05)") // lagani glow efekt
        .attr("stroke", boja)
        .attr("stroke-width", 2)
        .attr("opacity", 1);

    // 1. tranzicija - punjenje
    kvadrat.transition()
        .delay(3000)
        .duration(trajanjePunjenja)
        .ease(d3.easeCubic)
        .attr("fill", boja)
        .on("end", function() {

            // 2. tranzicija - smanjenje + nestajanje
            d3.select(this).transition()
                .duration(trajanjeNestajanja)
                .ease(d3.easeLinear)
                .attr("width", startSize / 2)
                .attr("height", startSize / 2)
                .attr("x", startX + startSize / 4) // centriranje
                .attr("y", startY + startSize / 4)
                .attr("opacity", 0)
                .on("end", function() {
                    animirajKvadrat(d3.select(this));
                });
        });
}

// 10 kvadrata
for (let i = 0; i < 10; i++) {
    const noviKvadrat = svg.append("rect");
    animirajKvadrat(noviKvadrat);
}
</script>

</body>
</html>
