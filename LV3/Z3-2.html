<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Z3-2</title>
    <script src="https://d3js.org/d3.v3.min.js"></script>
</head>
<body>

<script>
    var widthSVG = 800;
    var heightSVG = 500;
    var brojKvadrata = 10;

    var svg = d3.select("body")
        .append("svg")
        .attr("width", widthSVG)
        .attr("height", heightSVG)
        .style("border", "1px solid #ccc");

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pokreniAnimaciju() {
        svg.selectAll("*").remove();

        var data = d3.range(brojKvadrata).map(function () {
            var size = randomInt(30, 80);
            return {
                x: randomInt(0, widthSVG - size),
                y: randomInt(0, heightSVG - size),
                size: size,
                fillDuration: randomInt(1000, 4000),
                growDuration: randomInt(1000, 4000),
                delayStart: randomInt(0, 2000)
            };
        });

        var maxUkupnoVrijeme = 0;

        data.forEach(function (d) {
            var ukupno = d.delayStart + d.fillDuration + d.growDuration;
            if (ukupno > maxUkupnoVrijeme) {
                maxUkupnoVrijeme = ukupno;
            }

            var rect = svg.append("rect")
                .attr("x", d.x)
                .attr("y", d.y)
                .attr("width", d.size)
                .attr("height", d.size)
                .attr("fill", "none")
                .attr("stroke", "purple")
                .attr("stroke-width", 2)
                .attr("opacity", 1);

            rect.transition()
                .delay(d.delayStart)
                .duration(d.fillDuration)
                .attr("fill", "gold")
                .each("end", function () {
                    var novaVelicina = randomInt(100, Math.floor(widthSVG / 4));

                    d3.select(this)
                        .transition()
                        .duration(d.growDuration)
                        .attr("x", Math.max(0, d.x - (novaVelicina - d.size) / 2))
                        .attr("y", Math.max(0, d.y - (novaVelicina - d.size) / 2))
                        .attr("width", novaVelicina)
                        .attr("height", novaVelicina)
                        .attr("opacity", 0);
                });
        });

        setTimeout(pokreniAnimaciju, maxUkupnoVrijeme + 500);
    }

    pokreniAnimaciju();
</script>

</body>
</html>
