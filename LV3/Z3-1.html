<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Z3-1</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #1e1e2f; /* tamna pozadina */
        }
        svg { 
            background-color: white; 
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<script>
const widthSVG = 500;
const heightSVG = 500;

const svg = d3.select("body")
    .append("svg")
    .attr("width", widthSVG)
    .attr("height", heightSVG);

// KVADRAT
const kvadrat = svg.append("rect")
    .attr("x", 200)
    .attr("y", 200)
    .attr("width", 100)
    .attr("height", 100)
    .attr("fill", "rgba(128, 0, 128, 0.2)") // lagano ljubičasto
    .attr("stroke", "#ff4da6") // pink obrub
    .attr("stroke-width", 3)
    .attr("opacity", 1);

// PRVA TRANZICIJA
kvadrat.transition()
    .delay(3000)
    .duration(5000)
    .ease(d3.easeCubic)
    .attr("fill", "rgba(128, 0, 128, 1)") // puna ljubičasta
    .on("end", function() {

// DRUGA TRANZICIJA
d3.select(this).transition()
    .duration(5000)
    .ease(d3.easeLinear)
    .attr("width", 50)
    .attr("height", 50)
    .attr("x", 225) // da ostane centriran
    .attr("y", 225)
    .attr("opacity", 0);
});
</script>

</body>
</html>
