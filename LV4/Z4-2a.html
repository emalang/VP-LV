<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Z4-2a</title>
<script src="https://d3js.org/d3.v3.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; }
  text { font-size: 13px; fill: #111; font-weight: bold; }
</style>
</head>
<body>
<h2>Z4-2a: Tekst iznad kružnog prikaza</h2>
<script>
var width = 600;
var height = 600;
var outerRadius = 190;
var labelRadius = 235;
var innerRadius = 0;

var color = d3.scale.category20();

var arc = d3.svg.arc()
    .innerRadius(innerRadius)
    .outerRadius(outerRadius);

var labelArc = d3.svg.arc()
    .innerRadius(labelRadius)
    .outerRadius(labelRadius);

// Vrijednosti su namjerno izmijenjene tako da se vide vrlo mali segmenti.
var data = [
    {name: 'jabuka', value: 60},
    {name: 'kruska', value: 3},
    {name: 'banana', value: 7},
    {name: 'jagoda', value: 25},
    {name: 'ribizla', value: 2}
];

var pie = d3.layout.pie()
    .value(function(d) { return d.value; });

var svg = d3.select("body")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

var pieArcs = svg.selectAll("g.pie")
    .data(pie(data))
    .enter()
    .append("g")
    .attr("class", "pie")
    .attr("transform", "translate(" + (width / 2) + "," + (height / 2) + ")");

// Prvo crtamo segmente.
pieArcs.append("path")
    .attr("fill", function(d, i) { return color(i); })
    .attr("d", arc);

// Tekst dodajemo nakon path elemenata i stavljamo ga izvan kružnog prikaza.
pieArcs.append("text")
    .attr("transform", function(d) { return "translate(" + labelArc.centroid(d) + ")"; })
    .attr("text-anchor", "middle")
    .text(function(d) { return d.data.name + " - " + d.data.value; });
</script>
</body>
</html>
