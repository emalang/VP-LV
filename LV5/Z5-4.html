<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Z5-4</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            text-align: center;
            margin: 20px 0 8px;
        }

        .wrapper {
            width: 1000px;
            max-width: 95vw;
            margin: 0 auto;
        }

        .info {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        svg {
            display: block;
            margin: 0 auto 24px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .county {
            stroke: #333;
            stroke-width: 0.7px;
            cursor: pointer;
        }

        .county:hover {
            stroke: #111;
            stroke-width: 2px;
        }

        .legend text {
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="wrapper">
    <h1>Z5-4: Klik na županiju, zoom-in i povratak nakon 10 sekundi</h1>

    <div id="podaci" class="info">
       
    </div>

    <svg id="karta" width="900" height="700"></svg>
</div>

<script>
    const width = 900;
    const height = 700;

    const svg = d3.select('#karta');
    const g = svg.append('g');

    let timer = null;

    const projection = d3.geoMercator()
        .center([16.4, 45.15])
        .scale(6000)
        .translate([width / 2, 325]);

    const path = d3.geoPath().projection(projection);
    const info = d3.select('#podaci');

    const zoom = d3.zoom()
        .scaleExtent([1, 8])
        .on('zoom', event => {
            g.attr('transform', event.transform);
        });

    svg.call(zoom);

    function resetMap() {
        svg.transition()
            .duration(1000)
            .call(zoom.transform, d3.zoomIdentity);

        info.html(
            'Klikni na županiju. Karta će se približiti, prikazati podatke i nakon 10 sekundi vratiti na početni prikaz.'
        );
    }

    d3.json('cro.json').then(data => {

        const counties = topojson.feature(data, data.objects.layer1).features;

        const values = counties.map(d => d.properties.population);

        const color = d3.scaleSequential()
            .domain([d3.min(values), d3.max(values)])
            .interpolator(d3.interpolateYlOrRd);

        g.selectAll('path')
            .data(counties)
            .enter()
            .append('path')
            .attr('class', 'county')
            .attr('d', path)
            .attr('fill', d => color(d.properties.population))

            .on('click', (event, d) => {
                if (timer) {
                    clearTimeout(timer);
                }

                const p = d.properties;

                const [[x0, y0], [x1, y1]] = path.bounds(d);

                const scale = Math.min(
                    8,
                    0.85 / Math.max(
                        (x1 - x0) / width,
                        (y1 - y0) / height
                    )
                );

                const translate = [
                    width / 2 - scale * (x0 + x1) / 2,
                    height / 2 - scale * (y0 + y1) / 2
                ];

                svg.transition()
                    .duration(1000)
                    .call(
                        zoom.transform,
                        d3.zoomIdentity
                            .translate(translate[0], translate[1])
                            .scale(scale)
                    );

                info.html(`
                    <b>${p.name}</b><br>
                    Stanovnika: ${p.population.toLocaleString('hr-HR')}<br>
                    Površina: ${p.area.toLocaleString('hr-HR')} km²<br>
                    Župan: ${p.mayor}
                `);

                timer = setTimeout(resetMap, 10000);
            });

        const legend = svg.append('g')
            .attr('class', 'legend')
            .attr('transform', 'translate(80,640)');

        const defs = svg.append('defs');

        const grad = defs.append('linearGradient')
            .attr('id', 'grad')
            .attr('x1', '0%')
            .attr('x2', '100%');

        for (let i = 0; i <= 10; i++) {
            grad.append('stop')
                .attr('offset', `${i * 10}%`)
                .attr(
                    'stop-color',
                    color(
                        d3.min(values) +
                        (d3.max(values) - d3.min(values)) * i / 10
                    )
                );
        }

        legend.append('rect')
            .attr('width', 240)
            .attr('height', 14)
            .attr('fill', 'url(#grad)');

        legend.append('text')
            .attr('x', 0)
            .attr('y', 34)
            .text(d3.min(values).toLocaleString('hr-HR'));

        legend.append('text')
            .attr('x', 240)
            .attr('y', 34)
            .attr('text-anchor', 'end')
            .text(d3.max(values).toLocaleString('hr-HR'));

        legend.append('text')
            .attr('x', 0)
            .attr('y', -8)
            .text('Broj stanovnika');
    });
</script>

</body>
</html>
