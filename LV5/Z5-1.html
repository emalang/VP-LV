<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Z5-1</title>

    <!-- D3 i TopoJSON -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            text-align: center;
            margin: 20px 0 8px;
        }

        .wrapper {
            width: 1000px;
            max-width: 95vw;
            margin: 0 auto;
        }

        .info {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        svg {
            display: block;
            margin: 0 auto 24px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .county {
            stroke: #333;
            stroke-width: 0.7px;
            cursor: pointer;
        }

        .county:hover {
            stroke: #111;
            stroke-width: 2px;
        }
    </style>
</head>

<body>

<div class="wrapper">
    <h1>Z5-1: Karta RH i ispis naziva županije</h1>

    <div id="naziv" class="info">
        
    </div>

    <svg id="karta" width="900" height="650"></svg>
</div>

<script>
    const width = 900;
    const height = 650;

    const svg = d3.select('#karta');
    const g = svg.append('g');

    const projection = d3.geoMercator()
        .center([16.4, 45.15])
        .scale(6000)
        .translate([width / 2, height / 2]);

    const path = d3.geoPath().projection(projection);
    const naziv = d3.select('#naziv');

    d3.json('cro.json').then(data => {

        const counties = topojson.feature(data, data.objects.layer1).features;

        g.selectAll('path')
            .data(counties)
            .enter()
            .append('path')
            .attr('class', 'county')
            .attr('d', path)
            .attr('fill', '#d7e9f7')

            .on('mouseover', (event, d) => {
                naziv.text('Županija: ' + d.properties.name);
                d3.select(event.currentTarget)
                    .attr('fill', '#8ecae6');
            })

            .on('mouseout', (event, d) => {
                naziv.text('Prijeđi mišem preko županije.');
                d3.select(event.currentTarget)
                    .attr('fill', '#d7e9f7');
            });
    });
</script>

</body>
</html>
